<div class="container">
  <h1>Special Pipes</h1>


  <section>
    <table border="1">
      <thead>
        <th>Id</th>
        <th>Name</th>
        <th>User</th>
        <th>Email</th>
        <th>Phone</th>
      </thead>

      <tbody>
        <tr *ngFor="let user of users | async">
          <td>{{user.id}}</td>
          <td>{{user.name}}</td>
          <td>{{user.username}}</td>
          <td>{{user.email}}</td>
          <td>{{user.phone}}</td>
        </tr>
      </tbody>
    </table>
  </section>
